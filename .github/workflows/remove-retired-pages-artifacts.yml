name: Remove retired Pages artifacts

on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-retired-pages-artifacts.yml]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Delete explicitly identified retired build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const ids = [13108880537,13101251592,13099901664,13098681043,13076147013,13074920212,13074509269,13074122130,13073766501,13073687865,13073566768,13072847484,13072362773,13072292594,13072291948,13072025814,13071246257,13071143265,13070742982];
          if (process.env.GITHUB_REPOSITORY !== 'sl-knowledge/knowledge-site') throw new Error('Unexpected repository');
          const base = 'https://api.github.com/repos/sl-knowledge/knowledge-site/actions/artifacts/';
          const headers = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
          let deleted = 0;
          for (const id of ids) {
            const response = await fetch(base + id, {headers, redirect: 'error'});
            if (response.status === 404) continue;
            if (!response.ok) throw new Error(`Artifact metadata HTTP ${response.status}`);
            const artifact = await response.json();
            if (artifact.name !== 'github-pages' || artifact.created_at >= '2026-11-02T03:31:00Z') throw new Error('Artifact outside the reviewed retirement scope');
            const result = await fetch(base + id, {method: 'DELETE', headers, redirect: 'error'});
            if (result.status !== 204) throw new Error(`Artifact deletion HTTP ${result.status}`);
            deleted++;
            console.log(`Deleted retired artifact ${id}`);
          }
          for (const id of ids) {
            const result = await fetch(base + id, {headers, redirect: 'error'});
            if (result.status !== 404) throw new Error('Retired artifact still accessible');
          }
          console.log(`Verified all ${ids.length} retired artifacts absent; deleted ${deleted} in this run.`);
          NODE
